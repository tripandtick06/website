# Cloudflare Pages config — @cloudflare/next-on-pages adapter
# Reference: https://developers.cloudflare.com/pages/framework-guides/nextjs/
#
# Production deploy:
#   1. npm run build:cf
#   2. npx wrangler pages deploy .vercel/output/static --project-name=tripandtick
# Veya GitHub auto-deploy (Pages dashboard -> Connect repo).

name = "tripandtick"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Production env (placeholders) — gercek degerler Cloudflare Pages dashboard'da
# "Environment variables" + "Secrets" altinda set edilir.
[vars]
NEXT_PUBLIC_SITE_URL = "https://www.tripandtick.com"
NEXT_PUBLIC_DEFAULT_LOCALE = "tr"
NEXT_PUBLIC_IYZICO_ENABLED = "false"

# --- Secret keys (Cloudflare Pages dashboard "Encrypted" olarak set) ---
# STRIPE_SECRET_KEY        sk_live_...
# STRIPE_WEBHOOK_SECRET    whsec_...
# IYZICO_API_KEY           (iyzico merchant onay sonrasi)
# IYZICO_SECRET            (iyzico merchant onay sonrasi)
# IYZICO_BASE_URL          https://api.iyzipay.com
# ADMIN_API_TOKEN          openssl rand -hex 32
# NEXT_PUBLIC_ADMIN_TOKEN  ADMIN_API_TOKEN ile AYNI deger
# ADMIN_EMAIL              info@tripandtick.com
# RESCHEDULE_SECRET        openssl rand -hex 32
# BREVO_API_KEY            xkeysib-...
# BREVO_FROM_EMAIL         hello@tripandtick.com (DKIM verify gerekli)
# BREVO_FROM_NAME          Trip and Tick
# NEXT_PUBLIC_SUPABASE_URL https://<ref>.supabase.co
# NEXT_PUBLIC_SUPABASE_ANON_KEY  ey...
# SUPABASE_SERVICE_ROLE_KEY      ey...
# CRON_SECRET              openssl rand -hex 32
# ANTHROPIC_API_KEY        sk-ant-... (rotate)
# GOOGLE_AI_API_KEY        AIza...
# INDEXNOW_KEY             (opsiyonel)
