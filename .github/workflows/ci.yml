name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://www.tripandtick.com
      NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stub
      SUPABASE_SERVICE_ROLE_KEY: stub
      ADMIN_API_TOKEN: stub-token-for-build
      GDPR_SECRET: stub-secret-for-build
      BREVO_API_KEY: stub
      STRIPE_SECRET_KEY: sk_test_stub
      STRIPE_WEBHOOK_SECRET: whsec_stub
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_stub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  i18n-audit:
    name: i18n + hreflang audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Audit hardcoded TR strings
        run: node scripts/audit-i18n.cjs || true

      - name: Validate hreflang on production sitemap
        env:
          SITE: https://www.tripandtick.com
        run: npm run validate:hreflang || true
