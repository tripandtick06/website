name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build (@cloudflare/next-on-pages) + wrangler pages deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build-time public env (non-secret). Production secrets are read at
      # request time from Cloudflare Pages "Environment variables" UI.
      NEXT_PUBLIC_SITE_URL: https://www.tripandtick.com
      NEXT_PUBLIC_DEFAULT_LOCALE: tr
      # Stubs for build only — real values via Pages dashboard env vars.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://stub.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'stub' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'stub' }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN || 'stub-token-for-build' }}
      GDPR_SECRET: ${{ secrets.GDPR_SECRET || 'stub-secret-for-build-only-32chars-min' }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || 'stub' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_stub' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_stub' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_stub' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Cloudflare token permissions
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1) Token must be active — catches a missing, expired, or mistyped secret.
          VERIFY=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "$VERIFY" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid, expired, or missing (HTTP ${VERIFY}). Regenerate it in the Cloudflare dashboard. See CLOUDFLARE_TOKEN_PERMISSIONS.md."
            exit 1
          fi
          # 2) Token must carry "User -> User Details -> Read". wrangler pages
          #    deploy reads the account owner's email; without this scope it fails
          #    late with "Authentication error [code: 10000]" on the Pages endpoint.
          #    /user returns 200 only when that permission is present.
          USERCODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user")
          if [ "$USERCODE" != "200" ]; then
            echo "::error::Token is active but is missing 'User -> User Details -> Read' (HTTP ${USERCODE} from /user). Add that permission to the token in the Cloudflare dashboard. See CLOUDFLARE_TOKEN_PERMISSIONS.md."
            exit 1
          fi
          # 3) Token must reach the Pages API for THIS account — catches a token
          #    missing "Account -> Cloudflare Pages -> Edit", an account-resource
          #    scope that excludes this account, or a wrong CLOUDFLARE_ACCOUNT_ID.
          #    This is the exact endpoint `wrangler pages deploy` hits.
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is empty. Set it to the account that owns the 'tripandtick' Pages project."
            exit 1
          fi
          PAGES=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects?per_page=1")
          if [ "$PAGES" != "200" ]; then
            echo "::error::Token cannot access Pages for this account (HTTP ${PAGES} from /accounts/<id>/pages/projects). Add 'Account -> Cloudflare Pages -> Edit' and ensure the token's Account Resources include this account, and that CLOUDFLARE_ACCOUNT_ID is correct. See CLOUDFLARE_TOKEN_PERMISSIONS.md."
            exit 1
          fi
          echo "Cloudflare token verified: active, 'User Details: Read', and Pages access for the account."

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (next-on-pages adapter)
        run: npm run build:cf

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 4.x auto-creates the Pages project on first deploy; 3.90
          # (action default) fails non-interactively when project absent.
          wranglerVersion: "4"
          command: pages deploy .vercel/output/static --project-name=website --branch=master --commit-dirty=true
