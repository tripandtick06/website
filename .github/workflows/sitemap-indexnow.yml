name: Sitemap Submit (IndexNow)

on:
  workflow_dispatch:
      inputs:
            urls:
                    description: "Newline-separated URLs to submit (leave blank to auto-parse sitemap)"
                            required: false
                                    default: ""

                                    jobs:
                                      indexnow:
                                          name: Submit URLs via IndexNow
                                              runs-on: ubuntu-latest
                                                  steps:
                                                        - name: Fetch sitemap and extract URLs
                                                                id: extract
                                                                        run: |
                                                                                  SITEMAP_URL="https://tripandtick.com/sitemap.xml"
                                                                                            MANUAL_URLS="${{ github.event.inputs.urls }}"

                                                                                                      if [ -n "$MANUAL_URLS" ]; then
                                                                                                                  # Use manually provided URLs
                                                                                                                              URL_LIST=$(echo "$MANUAL_URLS" | tr '\n' ',' | sed 's/,$//')
                                                                                                                                          echo "url_list=$URL_LIST" >> $GITHUB_OUTPUT
                                                                                                                                                    else
                                                                                                                                                                # Fetch sitemap and parse <loc> tags
                                                                                                                                                                            SITEMAP=$(curl -s "$SITEMAP_URL")
                                                                                                                                                                                        URL_LIST=$(echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' | head -50 | tr '\n' ',' | sed 's/,$//')
                                                                                                                                                                                                    echo "url_list=$URL_LIST" >> $GITHUB_OUTPUT
                                                                                                                                                                                                              fi
                                                                                                                                                                                                              
                                                                                                                                                                                                                        echo "Extracted URLs: $URL_LIST"
                                                                                                                                                                                                                        
                                                                                                                                                                                                                              - name: Build JSON payload
                                                                                                                                                                                                                                      id: payload
                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                        IFS=',' read -ra URLS <<< "${{ steps.extract.outputs.url_list }}"
                                                                                                                                                                                                                                                                  JSON_URLS=$(printf '"%s",' "${URLS[@]}" | sed 's/,$//')
                                                                                                                                                                                                                                                                            PAYLOAD="{\"host\":\"tripandtick.com\",\"key\":\"${{ secrets.INDEXNOW_KEY }}\",\"keyLocation\":\"https://tripandtick.com/${{ secrets.INDEXNOW_KEY }}.txt\",\"urlList\":[$JSON_URLS]}"
                                                                                                                                                                                                                                                                                      echo "payload=$PAYLOAD" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                                                echo "Payload: $PAYLOAD"
                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                      - name: Submit to Bing (IndexNow)
                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
                                                                                                                                                                                                                                                                                                                                    -X POST \
                                                                                                                                                                                                                                                                                                                                                -H "Content-Type: application/json; charset=utf-8" \
                                                                                                                                                                                                                                                                                                                                                            -d '${{ steps.payload.outputs.payload }}' \
                                                                                                                                                                                                                                                                                                                                                                        "https://www.bing.com/indexnow")
                                                                                                                                                                                                                                                                                                                                                                                  echo "Bing response: $RESPONSE"
                                                                                                                                                                                                                                                                                                                                                                                            if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "202" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                        echo "::warning::Bing IndexNow returned HTTP $RESPONSE"
                                                                                                                                                                                                                                                                                                                                                                                                                  else
                                                                                                                                                                                                                                                                                                                                                                                                                              echo "Bing submission successful (HTTP $RESPONSE)"
                                                                                                                                                                                                                                                                                                                                                                                                                                        fi
                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Submit to Yandex (IndexNow)
                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            -X POST \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        -H "Content-Type: application/json; charset=utf-8" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    -d '${{ steps.payload.outputs.payload }}' \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "https://yandex.com/indexnow")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "Yandex response: $RESPONSE"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "202" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "::warning::Yandex IndexNow returned HTTP $RESPONSE"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "Yandex submission successful (HTTP $RESPONSE)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Summary
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "### IndexNow Submission Complete" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "**URLs submitted:** ${{ steps.extract.outputs.url_list }}" >> $GITHUB_STEP_SUMMARY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "**Engines:** Bing, Yandex" >> $GITHUB_STEP_SUMMARY
