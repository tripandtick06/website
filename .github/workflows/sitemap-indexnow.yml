name: Sitemap Submit (IndexNow)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs to submit, one per line (blank = auto-parse sitemap)'
        required: false
        default: ''

jobs:
  indexnow:
    name: Submit URLs via IndexNow
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      SITE_HOST: tripandtick.com
    steps:
      - name: Build URL list and submit
        run: |
          set -e
          KEY="$INDEXNOW_KEY"
          HOST="$SITE_HOST"
          MANUAL="${{ github.event.inputs.urls }}"

          if [ -n "$MANUAL" ]; then
            URLS=$(echo "$MANUAL" | tr '\n' ' ' | xargs)
          else
            URLS=$(curl -sf "https://${HOST}/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+' | head -50 | tr '\n' ' ' | xargs)
          fi

          # Build JSON array
          JSON_ARRAY=$(echo "$URLS" | tr ' ' '\n' | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")

          echo "URLs: $JSON_ARRAY"

          PAYLOAD=$(python3 -c "
          import json
          key = '$KEY'
          host = '$HOST'
          import sys
          urls = $JSON_ARRAY
          payload = {'host': host, 'key': key, 'keyLocation': f'https://{host}/{key}.txt', 'urlList': urls}
          print(json.dumps(payload))
          ")

          echo "Payload length: ${#PAYLOAD}"

          # Submit to Bing
          BING=$(curl -s -o /tmp/bing_resp.txt -w "%{http_code}" \
            -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD" \
            'https://www.bing.com/indexnow')
          echo "Bing HTTP: $BING"
          cat /tmp/bing_resp.txt || true
          [ "$BING" = "200" ] || [ "$BING" = "202" ] && echo 'Bing OK' || echo "::warning::Bing returned HTTP $BING"

          # Submit to Yandex
          YANDEX=$(curl -s -o /tmp/yandex_resp.txt -w "%{http_code}" \
            -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD" \
            'https://yandex.com/indexnow')
          echo "Yandex HTTP: $YANDEX"
          cat /tmp/yandex_resp.txt || true
          [ "$YANDEX" = "200" ] || [ "$YANDEX" = "202" ] && echo 'Yandex OK' || echo "::warning::Yandex returned HTTP $YANDEX"

      - name: Summary
        if: always()
        run: |
          echo '### IndexNow Submission' >> $GITHUB_STEP_SUMMARY
          echo '**Engines:** Bing, Yandex' >> $GITHUB_STEP_SUMMARY
